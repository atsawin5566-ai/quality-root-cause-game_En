<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Why Root Cause Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

h1{
    text-align:center;
    color:#facc15;
}

.score{
    font-size:18px;
    font-weight:bold;
    color:#facc15;
}

.timer{
    font-size:24px;
    font-weight:bold;
    color:#4ade80;
    margin-top:10px;
}

.slot{
    min-height:30px;
    background:#334155;
    border:2px dashed #64748b;
    border-radius:8px;
    padding:5px;
    margin:8px 0;
}

.item{
    background:#2563eb;
    padding:12px;
    border-radius:8px;
    margin:6px 0;
    cursor:pointer;
}

.selected{
    outline:3px solid yellow;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px;
}

.check{
    background:#16a34a;
    color:white;
}

.reset{
    background:#dc2626;
    color:white;
}

.next{
    background:#2563eb;
    color:white;
}

.correct{
    color:#4ade80;
    font-weight:bold;
}

.wrong{
    color:#f87171;
    font-weight:bold;
}

.success{
    animation:pop .8s ease;
}

@keyframes pop{
0%{
transform:scale(.5);
opacity:0;
}
50%{
transform:scale(1.2);
}
100%{
transform:scale(1);
opacity:1;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 5 Why Root Cause Challenge</h1>

<div class="card">

<div class="score">
🏆 คะแนนรวม :
<span id="score">0</span>
</div>

<div class="timer">
⏱️ <span id="timer">90</span> วินาที
</div>

<hr>

<h2 id="caseTitle"></h2>

<div id="slots"></div>

<h3>เลือก Why แล้วแตะช่องวาง</h3>

<div id="pool"></div>

<button class="check" onclick="checkAnswer()">
✅ ตรวจคำตอบ
</button>

<button class="reset" onclick="clearAnswers()">
🗑 ล้างคำตอบ
</button>

<button class="next" onclick="newCase()">
🔄 สุ่มโจทย์ใหม่
</button>

<div id="result"></div>

</div>
</div>

<script>

const cases=[

{
title:"รอยบุบที่ด้านบนของชิ้นงาน",
rootCause:"พนักงานติดตั้งผ้าเช็ดไม่เป็นไปตามมาตรฐาน ทำให้กำจัดสิ่งแปลกปลอมได้ไม่สมบูรณ์ ส่งผลให้เกิดรอยบุบบนชิ้นงาน",
whys:[
"พบรอยบุบด้านบนชิ้นงาน",
"มีสิ่งแปลกปลอมบนผิวแม่พิมพ์ขณะขึ้นรูป",
"ผ้าเช็ดไม่สามารถกำจัดสิ่งแปลกปลอมบนผิวทองแดงได้อย่างมีประสิทธิภาพ",
"ติดตั้งผ้าเช็ดผิวทองแดงไม่ถูกต้อง",
"พนักงานไม่เข้าใจถึงความสำคัญของการยึดผ้าเช็ดให้แน่นตามข้อกำหนด ส่งผลต่อประสิทธิภาพในการกำจัดสิ่งแปลกปลอม"
]
},

{
title:"พบคราบสกปรกบนชิ้นงาน",
rootCause:"มาตรฐานการควบคุมความสะอาดไม่ครอบคลุมความเสี่ยงด้านการปนเปื้อนระหว่างการปฏิบัติงาน",
whys:[
"พบคราบสกปรกบนชิ้นงาน",
"มีสิ่งปนเปื้อนบนผิวชิ้นงาน",
"ชิ้นงานสัมผัสกับถุงมือหรือพื้นผิวที่มีคราบ",
"การควบคุมความสะอาดระหว่างการผลิตไม่เพียงพอ",
"ไม่มีมาตรฐานการควบคุมการปนเปื้อนที่ชัดเจน"
]
},

{
title:"พบการติดลาเบลผิด",
rootCause:"ไม่มีการควบคุมการแยกลาเบล ทำให้เกิดการหยิบใช้งานผิดและติดลาเบล ไม่ถูกต้อง",
whys:[
"พบการติดลาเบลผิด",
"มีการนำลาเบล ต่างชนิดมาปะปนกัน",
"ลาเบลไม่ได้ถูกแยกเก็บตามประเภทอย่างชัดเจน",
"ไม่มีวิธีการควบคุมการแยกลาเบลที่เป็นมาตรฐาน",
"ไม่มีข้อกำหนดหรือระบบควบคุมการแยกลาเบลในพื้นที่ปฏิบัติงาน"
]
},

{
title:"ขนาดชิ้นงานเกินสเปค",
rootCause:"เครื่องมือวัดไม่ได้สอลเทียบ ตามกำหนด ทำให้ผลการวัดคลาดเคลื่อนและชิ้นงานขนาดเกินสเปคถูกส่งต่อไปยังกระบวนการถัดไป",
whys:[
"พบขนาดชิ้นงานเกินสเปค",
"ค่าที่วัดได้ไม่สะท้อนขนาดจริงของชิ้นงาน",
"เครื่องมือวัดให้ค่าคลาดเคลื่อน",
"เครื่องมือวัดไม่ได้ผ่านการสอบเทียบ ตามกำหนด",
"ไม่มีการติดตามและควบคุมสถานะ สอบเทียบอย่างมีประสิทธิภาพ"
]
},

{
title:"ทองแดงเป็นสนิม",
rootCause:"ทองแดงหมดอายุการจัดเก็บ ทำให้เกิดสนิมบนวัตถุดิบ",
whys:[
"พบทองแดงเป็นสนิม",
"ทองแดงถูกนำมาใช้งานหลังหมดอายุการจัดเก็บ",
"ไม่มีการตรวจสอบอายุการจัดเก็บก่อนนำมาใช้งาน",
"ระบบควบคุม FIFO/FEFO ดำเนินการไม่ครบถ้วน",
"ไม่มีการติดตามและแจ้งเตือนวัตถุดิบใกล้หมดอายุอย่างเป็นระบบ"
]
}

];

let score=0;
let totalPlayed=0;
let selectedItem=null;
let currentCase=null;
let timer;
let timeLeft=90;
let currentIndex=-1;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function startTimer(){

clearInterval(timer);

timeLeft=90;

const timerEl=document.getElementById("timer");

timerEl.innerText=timeLeft;

timer=setInterval(()=>{

timeLeft--;

timerEl.innerText=timeLeft;

if(timeLeft<=30){
timerEl.style.color="#ef4444";
}
else if(timeLeft<=90){
timerEl.style.color="#facc15";
}
else{
timerEl.style.color="#4ade80";
}

if(timeLeft<=0){

clearInterval(timer);

document.querySelector(".check").disabled=true;
document.querySelector(".next").disabled=true;
document.querySelector(".reset").disabled=true;

document.getElementById("result").innerHTML=
`
<div class="success">

<h2 class="wrong">
⏰ หมดเวลา
</h2>

<hr>

<h2>🏆 สรุปผลการแข่งขัน</h2>

<p>คะแนนรวม : <b>${score}</b></p>

<p>จำนวนเคสที่เล่น : <b>${totalPlayed}</b></p>

<p>
Root Cause ล่าสุด :
<br><br>
<b>${currentCase.rootCause}</b>
</p>

</div>
`;

}

},1000);
}

function newCase(){

document.getElementById("result").innerHTML="";

let newIndex;

do{
newIndex=Math.floor(Math.random()*cases.length);
}
while(newIndex===currentIndex);

currentIndex=newIndex;
currentCase=cases[newIndex];

document.getElementById("caseTitle").innerHTML=
"🏭 "+currentCase.title;

const slots=document.getElementById("slots");
const pool=document.getElementById("pool");

slots.innerHTML="";
pool.innerHTML="";

for(let i=0;i<5;i++){

slots.innerHTML+=
`
<div>
<b>Why ${i+1}</b>
<div class="slot"></div>
</div>
`;

}

let shuffled=[...currentCase.whys];

shuffle(shuffled);

shuffled.forEach(text=>{

let div=document.createElement("div");

div.className="item";
div.innerText=text;

div.onclick=function(){

document
.querySelectorAll(".item")
.forEach(x=>x.classList.remove("selected"));

selectedItem=div;

div.classList.add("selected");
};

pool.appendChild(div);

});

document
.querySelectorAll(".slot")
.forEach(slot=>{

slot.onclick=function(){

if(!selectedItem) return;

const exist=slot.querySelector(".item");

if(exist){
pool.appendChild(exist);
}

slot.innerHTML="";
slot.appendChild(selectedItem);

selectedItem.classList.remove("selected");
selectedItem=null;

};

});

startTimer();
}

function clearAnswers(){

const pool=document.getElementById("pool");

document.querySelectorAll(".slot .item")
.forEach(item=>{
pool.appendChild(item);
});

}

function checkAnswer(){

clearInterval(timer);

totalPlayed++;

let correct=0;

document
.querySelectorAll(".slot")
.forEach((slot,index)=>{

let item=slot.querySelector(".item");

if(item &&
item.innerText===currentCase.whys[index]){
correct++;
}

});

score += correct*2;

document.getElementById("score").innerText=score;

if(correct===5){

confetti({
particleCount:200,
spread:90,
origin:{y:0.6}
});

document.getElementById("result").innerHTML=
`
<div class="success">

<h2 class="correct">
🎉 PERFECT!
</h2>

<h1>
🏆 +10 คะแนน
</h1>

<hr>

<b>Root Cause:</b><br><br>
${currentCase.rootCause}

</div>
`;
}
else{

document.getElementById("result").innerHTML=
`
<p class="wrong">
✅ ถูก ${correct}/5
</p>

<p>
ได้รับ ${correct*2} คะแนน
</p>

<hr>

<b>Root Cause:</b><br><br>
${currentCase.rootCause}
`;
}

}

newCase();

</script>

</body>
</html>
