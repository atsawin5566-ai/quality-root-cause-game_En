<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Why Root Cause Challenge</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
}

h1{
    text-align:center;
    color:#facc15;
}

.score{
    font-size:18px;
    font-weight:bold;
    color:#facc15;
}

.timer{
    font-size:24px;
    font-weight:bold;
    color:#4ade80;
    margin-top:10px;
}

.slot{
    min-height:30px;
    background:#334155;
    border:2px dashed #64748b;
    border-radius:8px;
    padding:5px;
    margin:8px 0;
}

.item{
    background:#2563eb;
    padding:12px;
    border-radius:8px;
    margin:6px 0;
    cursor:pointer;
}

.selected{
    outline:3px solid yellow;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
    font-size:16px;
}

.check{
    background:#16a34a;
    color:white;
}

.reset{
    background:#dc2626;
    color:white;
}

.next{
    background:#2563eb;
    color:white;
}

.correct{
    color:#4ade80;
    font-weight:bold;
}

.wrong{
    color:#f87171;
    font-weight:bold;
}

.success{
    animation:pop .8s ease;
}

@keyframes pop{
0%{
transform:scale(.5);
opacity:0;
}
50%{
transform:scale(1.2);
}
100%{
transform:scale(1);
opacity:1;
}
#caseTitle{
    color:#facc15;
    margin:20px 0;
}

#pool{
    margin-top:15px;
}

    
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 5 Why Root Cause Challenge</h1>

<div class="card">

<div class="score">
🏆 Total Score :
<span id="score">0</span>
</div>

<div class="timer">
⏱️ <span id="timer">90</span> Seconds
</div>

<h3>Select a Why statement and click a slot</h3>

<h2 id="caseTitle"></h2>

<div id="slots"></div>

<h3>Why Statements</h3>

<div id="pool"></div>

<button class="check" onclick="checkAnswer()">
✅ Check Answer
</button>

<button class="reset" onclick="clearAnswers()">
🗑 Clear Answers
</button>

<button class="next" onclick="newCase()">
🔄 New Challenge
</button>
<div id="result"></div>

</div>
</div>

<script>

const cases=[
{
title:"Dent on Product Surface",
rootCause:"The operator installed the wiping cloth incorrectly, preventing complete removal of foreign particles and causing dents on the product surface.",
whys:[
"Dent found on the product surface",
"Foreign particles were present on the mold surface during forming",
"The wiping cloth could not effectively remove foreign particles from the copper surface",
"The copper wiping cloth was installed incorrectly",
"The operator did not understand the importance of securing the cloth according to the standard, reducing contamination removal effectiveness"
]
},
{
title:"Contamination Found on Product",
rootCause:"The cleanliness control standard did not adequately address contamination risks during operation.",
whys:[
"Contamination was found on the product",
"Contaminants were present on the product surface",
"The product contacted contaminated gloves or surfaces",
"Cleanliness control during production was insufficient",
"There was no clear contamination control standard"
]
},
{
title:"Incorrect Label Applied",
rootCause:"There was no label segregation control, causing operators to pick the wrong labels and apply them incorrectly.",
whys:[
"Incorrect label was applied",
"Different label types were mixed together",
"Labels were not clearly separated by category",
"There was no standard method for label segregation",
"There were no requirements or controls for label segregation in the work area"
]
},
{
title:"Product Dimension Out of Specification",
rootCause:"The measuring instrument was not calibrated as scheduled, resulting in inaccurate measurements and oversized products moving to the next process.",
whys:[
"Product dimension exceeded specification",
"The measured value did not reflect the actual product dimension",
"The measuring instrument provided inaccurate readings",
"The measuring instrument was not calibrated according to schedule",
"There was no effective calibration tracking and control system"
]
},
{
title:"Copper Material Corrosion",
rootCause:"The copper material exceeded its storage life, causing corrosion on the raw material.",
whys:[
"Copper corrosion was found",
"The copper was used after its storage life expired",
"The storage life was not checked before use",
"The FIFO/FEFO control process was not fully implemented",
"There was no systematic monitoring and alert system for materials approaching expiration"
]
}
];
let score=0;
let totalPlayed=0;
let selectedItem=null;
let currentCase=null;
let timer;
let timeLeft=90;
let currentIndex=-1;

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function startTimer(){

clearInterval(timer);

timeLeft=90;

const timerEl=document.getElementById("timer");

timerEl.innerText=timeLeft;

timer=setInterval(()=>{

timeLeft--;

timerEl.innerText=timeLeft;

if(timeLeft<=30){
timerEl.style.color="#ef4444";
}
else if(timeLeft<=90){
timerEl.style.color="#facc15";
}
else{
timerEl.style.color="#4ade80";
}

if(timeLeft<=0){

clearInterval(timer);

document.querySelector(".check").disabled=true;
document.querySelector(".next").disabled=true;
document.querySelector(".reset").disabled=true;

document.getElementById("result").innerHTML=
`
<div class="success">

<h2 class="wrong">
⏰ Time's Up
</h2>

<hr>

<h2>🏆 Competition Summary</h2>

<p>Total Score : <b>${score}</b></p>

<p>Cases Played : <b>${totalPlayed}</b></p>

<p>
Latest Root Cause :
<br><br>
<b>${currentCase.rootCause}</b>
</p>

</div>
`;

}

},1000);
}

function newCase(){

document.getElementById("result").innerHTML="";

let newIndex;

do{
newIndex=Math.floor(Math.random()*cases.length);
}
while(newIndex===currentIndex);

currentIndex=newIndex;
currentCase=cases[newIndex];

document.getElementById("caseTitle").innerHTML=
"🏭 "+currentCase.title;

const slots=document.getElementById("slots");
const pool=document.getElementById("pool");

slots.innerHTML="";
pool.innerHTML="";

for(let i=0;i<5;i++){

slots.innerHTML+=
`
<div>
<b>Why ${i+1}</b>
<div class="slot"></div>
</div>
`;

}

let shuffled=[...currentCase.whys];

shuffle(shuffled);

shuffled.forEach(text=>{

let div=document.createElement("div");

div.className="item";
div.innerText=text;

div.onclick=function(){

document
.querySelectorAll(".item")
.forEach(x=>x.classList.remove("selected"));

selectedItem=div;

div.classList.add("selected");
};

pool.appendChild(div);

});

document
.querySelectorAll(".slot")
.forEach(slot=>{

slot.onclick=function(){

if(!selectedItem) return;

const exist=slot.querySelector(".item");

if(exist){
pool.appendChild(exist);
}

slot.innerHTML="";
slot.appendChild(selectedItem);

selectedItem.classList.remove("selected");
selectedItem=null;

};

});

startTimer();
}

function clearAnswers(){

const pool=document.getElementById("pool");

document.querySelectorAll(".slot .item")
.forEach(item=>{
pool.appendChild(item);
});

}

function checkAnswer(){

clearInterval(timer);

totalPlayed++;

let correct=0;

document
.querySelectorAll(".slot")
.forEach((slot,index)=>{

let item=slot.querySelector(".item");

if(item &&
item.innerText===currentCase.whys[index]){
correct++;
}

});

score += correct*2;

document.getElementById("score").innerText=score;

if(correct===5){

confetti({
particleCount:200,
spread:90,
origin:{y:0.6}
});

document.getElementById("result").innerHTML=
`
<div class="success">

<h2 class="correct">
🎉 PERFECT!
</h2>

<h1>
🏆 +10 Points
</h1>

<hr>

<b>Root Cause:</b><br><br>
${currentCase.rootCause}

</div>
`;
}
else{

document.getElementById("result").innerHTML=
`
<p class="wrong">
✅ Correct ${correct}/5
</p>

<p>
You earned ${correct*2} points
</p>

<hr>

<b>Root Cause:</b><br><br>
${currentCase.rootCause}
`;
}

}

newCase();

</script>

</body>
</html>
